[package]
name = "application"
version = "0.1.0"
edition = "2021"

[dependencies]

uuid = { version = "1.10.0", features = ["v4"] }
chrono = {version = "0.4.39", features = ["serde"]}
axum = "0.8.1"
tokio = { version = "1.42.0", features = ["rt", "rt-multi-thread", "macros"] }
hyper = "1.5.2"
serde = { version = "1.0.217", features = ["derive"] }
anyhow = "1.0.95"

business = {version = "0.1.0", path = "../business" }