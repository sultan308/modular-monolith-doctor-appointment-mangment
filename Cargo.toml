[package]
name = "modular-monolith-doctor-appointment-booking"
version = "0.1.0"
edition = "2021"

[dependencies]
uuid = { version = "1.10.0", features = ["v4"] }
axum = { version = "0.8" , features = ["macros"]}
chrono = "0.4.39"
tokio = { version = "1.42", features = ["rt", "rt-multi-thread", "macros"] }
hyper = "1.5.2"
serde = { version = "1.0.217", features = ["derive"] }
mongodb = "3.2"
futures = "0.3.31"
dotenv = {version = "0.15.0"}

appointment_booking = {path = "./appointment_booking", version = "0.1.0"}
doctor_appointment_management = {path = "./doctor_appointment_management", version = "0.1.0"}
doctor_availability = {path = "./doctor_availability", version = "0.1.0"}
shared = {path = "./shared", version = "0.1.0"}
anyhow = "1.0.95"
tower = { version = "0.5.2", features = ["timeout"]}
